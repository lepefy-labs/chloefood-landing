<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chloé Food — Les saveurs de chez nous</title>
<meta name="description" content="Boutique en ligne de produits alimentaires africains. Livraison en Europe depuis Reggio Emilia.">
<meta property="og:title" content="Chloé Food">
<meta property="og:description" content="Les saveurs de chez nous — produits africains livrés en Europe.">

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--green:#1D9E75;--green-dark:#0F6E56;--green-light:#E1F5EE;--yellow:#F2C811;--yellow-text:#6B4800;--blue:#1267c7;--blue-dark:#0a4a9e;--text:#1a1a1a;--muted:#666;--border:#e5e7eb;--bg-alt:#f8faf9;--r:12px;--rs:8px}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:var(--text);background:#fff;line-height:1.6;font-size:16px}
.lang-bar{background:#fff;border-bottom:1px solid var(--border);padding:10px 20px;display:flex;justify-content:flex-end;gap:6px;position:sticky;top:0;z-index:100}
.lb{font-size:12px;font-weight:500;padding:4px 10px;border:1px solid var(--border);border-radius:20px;background:transparent;color:var(--muted);cursor:pointer;transition:all .15s}
.lb.active,.lb:hover{background:var(--green);color:#fff;border-color:var(--green)}
.hero{background:var(--blue);color:#fff;text-align:center;padding:56px 24px 48px}
.hero-logo{width:220px;margin:0 auto 20px}
.hero-logo img{width:100%;height:auto;display:block;filter:drop-shadow(0 6px 16px rgba(0,0,0,.18))}
.hero h1{font-size:28px;font-weight:700;margin-bottom:6px;letter-spacing:-.3px}
.hero .tagline{font-size:17px;opacity:.88;margin-bottom:10px;font-style:italic}
.hero .location{font-size:13px;opacity:.72;display:flex;align-items:center;justify-content:center;gap:5px}
.dot{width:6px;height:6px;background:var(--yellow);border-radius:50%;display:inline-block}
.hero-badge{display:inline-block;margin-top:18px;background:var(--yellow);color:var(--yellow-text);font-size:12px;font-weight:600;padding:6px 16px;border-radius:20px;letter-spacing:.02em}
.wrap{max-width:680px;margin:0 auto;padding:40px 20px}
.alt{background:var(--bg-alt)}
.stitle{font-size:20px;font-weight:700;margin-bottom:4px}
.ssub{font-size:14px;color:var(--muted);margin-bottom:24px}
.ngrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(max-width:380px){.ngrid{grid-template-columns:1fr}}
.ncard{background:var(--bg-alt);border-radius:var(--r);padding:20px 16px;text-align:center}
.nnum{font-size:36px;font-weight:700;color:var(--green);line-height:1;margin-bottom:5px}
.nlbl{font-size:13px;color:var(--muted);line-height:1.4}
.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.tcard{background:var(--bg-alt);border-radius:var(--r);padding:16px}
.tstars{color:var(--yellow);font-size:12px;letter-spacing:1px;margin-bottom:8px}
.tquote{font-size:13px;color:var(--text);line-height:1.6;margin-bottom:12px;font-style:italic}
.tquote::before{content:'\201C';font-size:20px;color:var(--green);line-height:0;vertical-align:-5px;margin-right:1px}
.tquote::after{content:'\201D';font-size:20px;color:var(--green);line-height:0;vertical-align:-5px;margin-left:1px}
.tauthor{display:flex;align-items:center;gap:8px}
.tavatar{width:34px;height:34px;border-radius:50%;background:var(--green);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tname{font-size:12px;font-weight:600;color:var(--text)}
.tloc{font-size:11px;color:var(--muted)}
.placeholder-note{font-size:11px;color:#704800;background:#fffbe6;border:1px dashed #F2C811;border-radius:6px;padding:6px 10px;margin-top:16px;display:inline-block}
.cgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:400px){.cgrid{grid-template-columns:repeat(2,1fr)}}
.ci{border:1px solid var(--border);border-radius:var(--rs);padding:14px 8px;text-align:center;background:#fff;transition:border-color .15s}
.ci:hover{border-color:var(--green)}
.cicon{font-size:28px;margin-bottom:6px}
.clabel{font-size:12px;font-weight:500;color:var(--muted)}
.ugrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:500px){.ugrid{grid-template-columns:1fr}}
.ui{text-align:center;padding:8px}
.uicon{font-size:36px;margin-bottom:10px}
.utitle{font-size:14px;font-weight:600;margin-bottom:4px}
.udesc{font-size:13px;color:var(--muted);line-height:1.5}
.icard{border:1px solid var(--border);border-radius:var(--r);background:#fff;overflow:hidden}
.irow{display:flex;gap:14px;align-items:flex-start;padding:14px 18px;border-bottom:1px solid var(--border);font-size:14px}
.irow:last-child{border-bottom:none}
.iico{font-size:20px;min-width:24px}
.ilbl{font-size:11px;color:var(--muted);margin-bottom:2px;font-weight:500;text-transform:uppercase;letter-spacing:.05em}
.ival{color:var(--text);font-weight:500}
a.ival{color:var(--green);text-decoration:none}
a.ival:hover{text-decoration:underline}
.cta{background:var(--green);padding:48px 24px;text-align:center;color:#fff}
.cta h2{font-size:22px;font-weight:700;margin-bottom:8px}
.cta p{font-size:15px;opacity:.85;margin-bottom:28px;max-width:420px;margin-left:auto;margin-right:auto}
.wa-btn{display:inline-flex;align-items:center;gap:10px;background:var(--yellow);color:var(--yellow-text);font-size:15px;font-weight:700;padding:14px 28px;border-radius:32px;border:none;cursor:pointer;text-decoration:none;transition:opacity .15s,transform .1s}
.wa-btn:hover{opacity:.92;transform:translateY(-1px)}
.wa-btn:active{transform:scale(.98)}
footer{text-align:center;padding:24px 20px;font-size:12px;color:var(--muted);border-top:1px solid var(--border);line-height:1.8}
footer a{color:var(--green);text-decoration:none}
footer a:hover{text-decoration:underline}
.hours-table{width:100%;font-size:13px;border-collapse:collapse}.hours-table td{padding:3px 0}.hours-table td:first-child{color:var(--muted);width:90px}.hours-table td:last-child{font-weight:500;color:var(--text)}.journey-section{background:#fff}.journey-steps{display:flex;flex-direction:column;gap:0}.jstep{display:flex;gap:16px;align-items:flex-start;padding:20px 0}.jstep-icon{font-size:28px;width:52px;height:52px;min-width:52px;background:var(--green-light);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}.jstep-title{font-size:15px;font-weight:700;color:var(--text);margin-bottom:5px}.jstep-desc{font-size:14px;color:var(--muted);line-height:1.65}.jstep-connector{width:52px;min-width:52px;display:flex;justify-content:center;padding:0;margin:0}.jstep-connector::before{content:'';display:block;width:2px;height:24px;background:var(--border)}.wa-float{position:fixed;bottom:24px;right:20px;z-index:999;display:flex;align-items:center;gap:10px;background:#25D366;color:#fff;font-size:14px;font-weight:600;padding:12px 18px 12px 14px;border-radius:32px;text-decoration:none;box-shadow:0 4px 20px rgba(37,211,102,.35);transition:transform .15s,box-shadow .15s}.wa-float:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(37,211,102,.45)}.wa-float:active{transform:scale(.97)}.wa-float-icon{font-size:20px;line-height:1}@media(max-width:480px){.wa-float .wa-float-label{display:none}.wa-float{padding:14px;border-radius:50%}}
</style>
</head>
